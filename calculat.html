<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Project</title>
    <link rel="stylesheet" href="calculat.css">

</head>
<body>
    <div class="calculator">
        <h1>Created By   <a href="#Kaleembaloch.com"> Kaleem Baloch<a></h1>
        <input type="text" placeholder="0" id="input-box">
        <div>
            <button class="AC">AC</button>
            <button class="optor">DEL</button>
            <button class="optor">%</button>
            <button class="optor">/</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="optor">*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="optor">-</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="optor">+</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="eqlbtn">=</button>
        </div>
    </div>
</body>
<script src="calculat.js"></script>
</html>
